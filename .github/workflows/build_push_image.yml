name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      image_tag:
        description: Target image tag (e.g. Git commit SHA or version string)
        required: true
        type: string
      ref:
        description: Git reference to checkout (branch, tag, or SHA). Defaults to default ref if omitted.
        required: false
        default: ""
        type: string
      push:
        description: Whether to push the image to configured container registries
        required: false
        default: false
        type: boolean
      dockerfile:
        description: Path to Dockerfile relative to repository root
        required: false
        default: "./Dockerfile"
        type: string
      context:
        description: Build context path
        required: false
        default: "."
        type: string
      cache:
        description: Whether to enable GitHub Actions layer cache (type=gha)
        required: false
        default: true
        type: boolean
    secrets:
      docker_username:
        description: Docker Hub username (optional; if omitted or empty, Docker Hub push is skipped)
        required: false
      docker_password:
        description: Docker Hub password or personal access token (optional; if omitted or empty, Docker Hub push is skipped)
        required: false
    outputs:
      image:
        description: Fully qualified GHCR image name (ghcr.io/org/repo)
        value: ${{ jobs.build.outputs.image }}
      image_tag:
        description: Built image tag
        value: ${{ jobs.build.outputs.image_tag }}
      ghcr_ref:
        description: Full image reference in GHCR (ghcr.io/org/repo:tag)
        value: ${{ jobs.build.outputs.ghcr_ref }}
      dockerhub_ref:
        description: Full image reference in Docker Hub if enabled (username/repo:tag)
        value: ${{ jobs.build.outputs.dockerhub_ref }}
      digest:
        description: Container image digest (sha256:...)
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ghcr_ref: ${{ steps.meta.outputs.ghcr_ref }}
      dockerhub_ref: ${{ steps.meta.outputs.dockerhub_ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository at provided ref
        if: inputs.ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout repository
        if: inputs.ref == ''
        uses: actions/checkout@v7

      - name: Resolve metadata and registry tags
        id: meta
        shell: bash
        env:
          DOCKER_USER: ${{ secrets.docker_username }}
          DOCKER_PASS: ${{ secrets.docker_password }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ENABLE_CACHE: ${{ inputs.cache }}
        run: |
          set -euo pipefail

          REPO_LOWER=$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${REPO_LOWER}"
          GHCR_REF="${GHCR_IMAGE}:${IMAGE_TAG}"

          echo "image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "ghcr_ref=${GHCR_REF}" >> "$GITHUB_OUTPUT"

          TAGS="${GHCR_REF}"

          if [ -n "${DOCKER_USER:-}" ] && [ -n "${DOCKER_PASS:-}" ]; then
            REPO_NAME="${REPOSITORY#*/}"
            REPO_NAME_LOWER=$(echo "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')
            USER_LOWER=$(echo "${DOCKER_USER}" | tr '[:upper:]' '[:lower:]')
            DOCKERHUB_REF="${USER_LOWER}/${REPO_NAME_LOWER}:${IMAGE_TAG}"
            echo "dockerhub_ref=${DOCKERHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
            TAGS="${TAGS},${DOCKERHUB_REF}"
          else
            echo "dockerhub_ref=" >> "$GITHUB_OUTPUT"
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

          if [ "${ENABLE_CACHE}" = "true" ]; then
            echo "cache_from=type=gha" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=gha,mode=max" >> "$GITHUB_OUTPUT"
          else
            echo "cache_from=" >> "$GITHUB_OUTPUT"
            echo "cache_to=" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.push && steps.meta.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ inputs.image_tag }}
          cache-from: ${{ steps.meta.outputs.cache_from }}
          cache-to: ${{ steps.meta.outputs.cache_to }}

      - name: Build summary
        if: always() && steps.build.outcome == 'success'
        shell: bash
        env:
          PUSH: ${{ inputs.push }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_REF: ${{ steps.meta.outputs.ghcr_ref }}
          DOCKERHUB_REF: ${{ steps.meta.outputs.dockerhub_ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ACTION_LABEL="Built"
          STATUS_ICON="🛠️"
          if [ "${PUSH}" = "true" ]; then
            ACTION_LABEL="Built & Pushed"
            STATUS_ICON="🚀"
          fi

          {
            echo "### ${STATUS_ICON} Container Image ${ACTION_LABEL}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **Tag** | \`${IMAGE_TAG}\` |"
            echo "| **Pushed** | \`${PUSH}\` |"
            echo "| **GHCR Target** | \`${GHCR_REF}\` |"
            if [ -n "${DOCKERHUB_REF}" ]; then
              echo "| **Docker Hub Target** | \`${DOCKERHUB_REF}\` |"
            fi
            if [ -n "${DIGEST}" ]; then
              echo "| **Digest** | \`${DIGEST}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
